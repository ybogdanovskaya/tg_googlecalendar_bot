# Temporary ACME-only site. Enable it only before the TLS certificate exists.
# Replace it with calendar.yibogdanovskaya.ru.conf after certbot succeeds.
server {
    listen 80;
    listen [::]:80;
    server_name calendar.yibogdanovskaya.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/calendar-miniapp-acme;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
