server {
    listen 80;
    listen [::]:80;
    server_name calendar-dev.yibogdanovskaya.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/calendar-miniapp-preview-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name calendar-dev.yibogdanovskaya.ru;

    ssl_certificate /etc/letsencrypt/live/calendar-dev.yibogdanovskaya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calendar-dev.yibogdanovskaya.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/calendar-miniapp-preview/static;
    index index.html;
    client_max_body_size 128k;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
