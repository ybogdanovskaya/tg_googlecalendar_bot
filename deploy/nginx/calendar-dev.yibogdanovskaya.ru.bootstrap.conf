# Temporary HTTP-only configuration used to complete the first ACME challenge.
# Replace it with calendar-dev.yibogdanovskaya.ru.conf immediately after
# Certbot successfully creates the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name calendar-dev.yibogdanovskaya.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/calendar-miniapp-preview-acme;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
