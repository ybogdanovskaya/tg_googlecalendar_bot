name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Scan tracked files for secrets
        run: python scripts/check_repository_secrets.py

      - name: Compile Python sources
        run: python -m compileall -q app scripts tests

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

  miniapp-checks:
    name: Mini App checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: miniapp

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build static Mini App
        run: npm run build

      - name: Verify static artifact stays untracked
        run: |
          test -f dist/index.html
          git -C "$GITHUB_WORKSPACE" check-ignore -q miniapp/dist
